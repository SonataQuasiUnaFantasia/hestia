spring.application.name=web
spring.profiles.default=local

spring.datasource.url=jdbc:mariadb://localhost:3307/hestia

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Images
app.upload.directory=${user.home}/hestia/uploads
app.upload.max-file-size=10MB
app.upload.max-dimension=8192
app.upload.max-pixels=50000000

spring.servlet.multipart.max-file-size=${app.upload.max-file-size}
spring.servlet.multipart.max-request-size=11MB
# Permet de renvoyer un 413 au lieu de couper la connexion quand un fichier dépasse la limite.
server.tomcat.max-swallow-size=32MB
