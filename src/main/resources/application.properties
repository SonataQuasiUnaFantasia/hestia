spring.application.name=web

# Le profil "local" (application-local.properties, ignore par Git) porte les identifiants de la base.
spring.profiles.default=local

spring.datasource.url=jdbc:mariadb://localhost:3307/hestia

# Le schema est gere uniquement par Flyway ; Hibernate se contente de le valider.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Meme strategie de nommage que le projet "api" qui partage la table UTILISATEUR.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# La base contient deja des tables (projet "api") : on l'adopte telle quelle puis on applique V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Premier administrateur (voir README) : valeurs fournies uniquement par variables d'environnement.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.nom=${APP_ADMIN_NOM:Administrateur}
app.admin.password=${APP_ADMIN_PASSWORD:}
